name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

      - name: Install Neovim 0.12
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.12.0/nvim-linux-x86_64.tar.gz \
            --output /tmp/nvim.tar.gz
          tar --extract --gzip --no-same-owner --file /tmp/nvim.tar.gz --directory /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check Lua syntax with Neovim
        run: |
          NVIM_LOG_FILE=/tmp/nvim.log nvim --headless --clean -u NONE \
            -c "lua local failed = false; for path, kind in vim.fs.dir('.', { depth = math.huge }) do if kind == 'file' and path:match('%.lua$') then local chunk, err = loadfile(path); if not chunk then vim.api.nvim_err_writeln(err); failed = true end end end; if failed then vim.cmd('cquit 1') end" \
            -c "quit"

      - name: Install smoke-test dependencies
        run: npm install --global tree-sitter-cli@0.26.1

      - name: Smoke test full config
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/nvim-config
          XDG_DATA_HOME: ${{ runner.temp }}/nvim-data
          XDG_STATE_HOME: ${{ runner.temp }}/nvim-state
          XDG_CACHE_HOME: ${{ runner.temp }}/nvim-cache
          NVIM_LOG_FILE: ${{ runner.temp }}/nvim-smoke.log
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          ln -s "$GITHUB_WORKSPACE" "$XDG_CONFIG_HOME/nvim"
          timeout 300 nvim --headless "$GITHUB_WORKSPACE/README.md" \
            -c "lua assert(require('core.dashboard').header())" \
            -c "qa"
